services:
  fintracker-bot:
    container_name: fintracker_app
    image: ghcr.io/linnod/myfinancetracker:latest
    build: .
    restart: always
    ports:
      - "5000:5000"
    environment:
      - TZ=Etc/UTC
      - DOTNET_ENVIRONMENT=Production
      - Telegram__Token=${TG_TOKEN}
      - Telegram__AllowedUserId=${TG_USER_ID}
      - Api__ApiKey=${API_KEY}
      - Api__Port=5000
      - GoogleSheets__SpreadsheetId=${GOOGLE_SHEET_ID}
      - GoogleSheets__CredentialsFilePath=/app/secrets/google-api-credentials.json
      - GoogleSheets__HeaderRowsCount=3
      - GoogleSheets__DecimalSeparator=,
      - YamlPersistence__FilePath=/app/data/categories.yaml
      - Interactions__EnableConsole=false
      - Interactions__EnableTelegram=true
      - Interactions__EnableApi=true
    volumes:
      - ./deploy/google-api-credentials.json:/app/secrets/google-api-credentials.json:ro
      - ./deploy/categories.yaml:/app/data/categories.yaml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tunnel:
    container_name: ngrok_tunnel
    image: ngrok/ngrok:latest
    restart: always
    command:
      - "http"
      - "--url=discourse-turbulent-abdominal.ngrok-free.dev"
      - "http://fintracker_app:5000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"