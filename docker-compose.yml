services:
  fintracker-bot:
    container_name: fintracker_app
    build: .
    restart: always
    volumes:
      - ./deploy/appsettings.json:/app/appsettings.json
      - ./deploy/google-api-credentials.json:/app/secrets/google-api-credentials.json
      - ./deploy/categories.yaml:/app/categories.yaml
    environment:
      - TZ=Europe/Moscow
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"