name: Test CD (Azure Container Apps)

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - destroy
  pull_request:
    branches:
      - main
    types:
      - closed

concurrency:
  group: test-aca-deploy
  cancel-in-progress: false

jobs:
  destroy:
    name: Stop Test Container App
    if: github.event.action == 'closed' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy')
    environment: test-aca
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Scale Container App to 0 replicas
        run: |
          az containerapp update \
            --resource-group rg-fintracker \
            --name ca-fintracker-test \
            --min-replicas 0 \
            --max-replicas 0

  deploy:
    name: Deploy to Azure Container Apps
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy'
    environment: test-aca
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Image Name to Lowercase
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists in GHCR
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash .github/scripts/verify-image-exists.sh

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new revision to Azure Container Apps
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az containerapp update \
            --resource-group rg-fintracker \
            --name ca-fintracker-test \
            --image "ghcr.io/${IMAGE_NAME}:${IMAGE_TAG}" \
            --min-replicas 1 \
            --max-replicas 1 \
            --set-env-vars "DOTNET_ENVIRONMENT=Test"
