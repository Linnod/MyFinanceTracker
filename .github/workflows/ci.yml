name: CI (Build & Test)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.MD'
      - 'README.md'
      - '**.md'
      - '**.MD'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.MD'
      - 'README.md'
      - '**.md'
      - '**.MD'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes

      - name: Run Tests
        run: dotnet test --configuration Release --verbosity normal --logger "trx" --results-directory ./TestResults

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: './TestResults/*.trx'
          reporter: dotnet-trx
