name: CI (Build & Test)

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths-ignore:
      - 'README.MD'
      - 'README.md'
      - '**.md'
      - '**.MD'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'README.MD'
      - 'README.md'
      - '**.md'
      - '**.MD'
      - 'docs/**'
      - '.gitignore'
      - '.env.example'
      - 'LICENSE'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Verify Code Formatting
        run: dotnet format --verify-no-changes

      - name: Run Tests
        run: dotnet test --configuration Release --verbosity normal --logger "trx" --results-directory ./TestResults

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: .NET Tests
          path: './TestResults/*.trx'
          reporter: dotnet-trx

  publish-container:
    name: Build & Publish Container
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Set Image Name to Lowercase
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Container to GHCR
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_TAG: ${{ github.sha }}
        run: >
          dotnet publish src/MyFinanceTracker.Host/MyFinanceTracker.Host.csproj 
          -c Release 
          /t:PublishContainer 
          /p:ContainerRegistry=ghcr.io
          /p:ContainerRepository=$IMAGE_NAME

      - name: Cleanup old container versions (keep last 5)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'myfinancetracker'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'
