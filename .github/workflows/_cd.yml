name: Reusable CD

on:
  workflow_call:
    inputs:
      target_dir:
        description: 'Target directory on server (e.g. ~/production or ~/test)'
        required: true
        type: string
      project_name:
        description: 'Docker compose project name (e.g. fintracker-prod or fintracker-test)'
        required: true
        type: string
      container_name:
        description: 'Docker container name (e.g. fintracker_app or fintracker_test_app)'
        required: true
        type: string
      clean_data:
        description: 'Whether to clean the deploy/data folder before deployment (resets SQLite DB)'
        required: false
        default: false
        type: boolean
      log_level:
        description: 'Logging level for MyFinanceTracker (e.g. Information or Debug)'
        required: false
        default: 'Information'
        type: string
    secrets:
      SERVER_HOST:
        required: true
      SERVER_USER:
        required: true
      SERVER_SSH_KEY:
        required: true
      TG_TOKEN:
        required: true
      TG_USER_ID:
        required: true
      GOOGLE_SHEET_ID:
        required: true
      GEMINI_API_KEY:
        required: true
      GEMINI_MODEL:
        required: true
      CATEGORIES_YAML:
        required: true
      GOOGLE_CREDENTIALS_JSON:
        required: true
      APPLICATIONINSIGHTS_CONNECTION_STRING:
        required: false

jobs:
  validate:
    name: Run CI
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build & Deploy Container
    needs: [validate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Set Image Name to Lowercase
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Container to GHCR
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_TAG: ${{ github.sha }}
        run: >
          dotnet publish src/MyFinanceTracker.Host/MyFinanceTracker.Host.csproj 
          -c Release 
          /t:PublishContainer 
          /p:ContainerRegistry=ghcr.io
          /p:ContainerRepository=$IMAGE_NAME

      - name: Prepare configuration files
        env:
          SECRET_TG_TOKEN: ${{ secrets.TG_TOKEN }}
          SECRET_TG_USER_ID: ${{ secrets.TG_USER_ID }}
          SECRET_GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SECRET_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECRET_GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SECRET_CATEGORIES: ${{ secrets.CATEGORIES_YAML }}
          SECRET_GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SECRET_APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
          CONTAINER_NAME: ${{ inputs.container_name }}
          LOG_LEVEL: ${{ inputs.log_level }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash .github/scripts/prepare-deploy-config.sh

      - name: Copy deployment files to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,.env,deploy/categories.yaml,deploy/google-api-credentials.json"
          target: "${{ inputs.target_dir }}"

      - name: Deploy container via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          TARGET_DIR: ${{ inputs.target_dir }}
          PROJECT_NAME: ${{ inputs.project_name }}
          IMAGE_TAG: ${{ github.sha }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLEAN_DATA: ${{ inputs.clean_data }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: TARGET_DIR,PROJECT_NAME,IMAGE_TAG,GH_ACTOR,GH_TOKEN,CLEAN_DATA
          script_path: .github/scripts/deploy-remote.sh
