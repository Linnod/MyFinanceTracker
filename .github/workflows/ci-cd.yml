name: CI/CD (Build, Test & Deploy)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Run Tests
        run: dotnet test --configuration Release --verbosity normal

  deploy:
    name: Publish & Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Set Image Name to Lowercase
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Container to GHCR
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_TAG: ${{ github.sha }}
        run: >
          dotnet publish src/MyFinanceTracker.Host/MyFinanceTracker.Host.csproj 
          -c Release 
          /t:PublishContainer 
          /p:ContainerRegistry=ghcr.io
          /p:ContainerRepository=$IMAGE_NAME

      - name: Copy docker-compose files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: "~/"

      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate
            sleep 5
            if [ -z "$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q --filter status=running fintracker-bot)" ]; then
              docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50
              exit 1
            fi
            docker image prune -f
            docker image prune -a --filter "until=72h" -f
