name: Test Environment (Preview Deploy)

on:
  push:
    branches: [ feature/flat-transactions-table ]

jobs:
  deploy-preview:
    name: Build & Deploy Test Environment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Set Image Name to Lowercase
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Container to GHCR
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          CONTAINER_TAG: ${{ github.sha }}
        run: >
          dotnet publish src/MyFinanceTracker.Host/MyFinanceTracker.Host.csproj 
          -c Release 
          /t:PublishContainer 
          /p:ContainerRegistry=ghcr.io
          /p:ContainerRepository=$IMAGE_NAME

      - name: Copy docker-compose and template files to test directory via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,deploy/categories.example.yaml"
          target: "~/test"

      - name: Prepare test configuration files on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRET_TG_TOKEN: ${{ secrets.TEST_TG_TOKEN }}
          SECRET_SHEET_ID: ${{ secrets.TEST_GOOGLE_SHEET_ID }}
          SECRET_CATEGORIES: ${{ secrets.TEST_CATEGORIES_YAML }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SECRET_TG_TOKEN,SECRET_SHEET_ID,SECRET_CATEGORIES,IMAGE_TAG
          script: |
            set -e
            mkdir -p ~/test/deploy/data
            chmod 777 ~/test/deploy/data

            # Reuse Google credentials from production deploy if present
            if [ -f ~/deploy/google-api-credentials.json ]; then
              cp ~/deploy/google-api-credentials.json ~/test/deploy/google-api-credentials.json
            fi

            # Inherit common keys from server ~/.env
            DEFAULT_GEMINI_KEY=""
            DEFAULT_GEMINI_MODEL="gemini-2.5-flash"
            DEFAULT_TG_USER_ID=""
            if [ -f ~/.env ]; then
              DEFAULT_GEMINI_KEY=$(grep '^GEMINI_API_KEY=' ~/.env | cut -d'=' -f2-)
              DEFAULT_GEMINI_MODEL=$(grep '^GEMINI_MODEL=' ~/.env | cut -d'=' -f2-)
              DEFAULT_TG_USER_ID=$(grep '^TG_USER_ID=' ~/.env | cut -d'=' -f2-)
            fi

            # Inherit existing test tokens if test/.env already exists
            EXISTING_TG_TOKEN=""
            EXISTING_SHEET_ID=""
            if [ -f ~/test/.env ]; then
              EXISTING_TG_TOKEN=$(grep '^TG_TOKEN=' ~/test/.env | cut -d'=' -f2-)
              EXISTING_SHEET_ID=$(grep '^GOOGLE_SHEET_ID=' ~/test/.env | cut -d'=' -f2-)
            fi

            FINAL_TG_TOKEN="$SECRET_TG_TOKEN"
            if [ -z "$FINAL_TG_TOKEN" ]; then FINAL_TG_TOKEN="$EXISTING_TG_TOKEN"; fi

            FINAL_SHEET_ID="$SECRET_SHEET_ID"
            if [ -z "$FINAL_SHEET_ID" ]; then FINAL_SHEET_ID="$EXISTING_SHEET_ID"; fi

            if [ -z "$FINAL_TG_TOKEN" ]; then
              echo "Error: Telegram Bot Token is required! Please configure TEST_TG_TOKEN in GitHub secrets."
              exit 1
            fi

            if [ -z "$FINAL_SHEET_ID" ]; then
              echo "Error: Google Sheet ID is required! Please configure TEST_GOOGLE_SHEET_ID in GitHub secrets."
              exit 1
            fi

            printf "%s\n" \
              "CONTAINER_NAME=fintracker_test_app" \
              "TG_TOKEN=$FINAL_TG_TOKEN" \
              "TG_USER_ID=$DEFAULT_TG_USER_ID" \
              "GOOGLE_SHEET_ID=$FINAL_SHEET_ID" \
              "GEMINI_API_KEY=$DEFAULT_GEMINI_KEY" \
              "GEMINI_MODEL=$DEFAULT_GEMINI_MODEL" \
              "IMAGE_TAG=$IMAGE_TAG" > ~/test/.env

            if [ -n "$SECRET_CATEGORIES" ]; then
              echo "$SECRET_CATEGORIES" > ~/test/deploy/categories.yaml
            elif [ ! -f ~/test/deploy/categories.yaml ]; then
              cp ~/test/deploy/categories.example.yaml ~/test/deploy/categories.yaml
            fi

      - name: Deploy test container
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            cd ~/test
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_TAG=$IMAGE_TAG
            docker compose -p fintracker-test -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -p fintracker-test -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate
            sleep 5

            if [ -z "$(docker compose -p fintracker-test -f docker-compose.yml -f docker-compose.prod.yml ps -q --filter status=running fintracker-bot)" ]; then
              echo "Test container failed to start. Logs:"
              docker compose -p fintracker-test -f docker-compose.yml -f docker-compose.prod.yml logs --tail 50
              exit 1
            fi

            echo "=== Test Environment is RUNNING! ==="
